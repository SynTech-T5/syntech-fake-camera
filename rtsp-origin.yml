# เปิด RTSP บน :8003
rtspAddress: :8003

# ไม่ต้องตั้งค่า WebRTC ในไฟล์นี้ก็ได้ (เราจะใช้ตัว whep-gateway เป็นคนปล่อย WHEP)

paths:
  # path สำหรับสตรีมภายใน: city-traffic
  city-traffic:
    # viewer RTSP (อ่านออก) — ให้ตรงกับที่คุณใช้อยู่
    readUser: viewer
    readPass: viewpass
    # publisher RTSP (เขียนเข้า)
    publishUser: pub
    publishPass: pubpass
