# RTSP inside docker network
rtspAddress: :8003

# WebRTC / WHEP
webrtcAddress: :8035            # WHEP endpoint (TCP)
webrtcLocalUDPAddress: :8036    # ICE/Media (UDP)
# webrtcLocalTCPAddress: :8036  # ถ้าต้อง TCP fallback ค่อยเปิด

# ชื่อโฮสต์ที่ผู้ชมจะใช้เชื่อม (สำคัญมากเวลาอยู่หลัง NAT/Reverse Proxy)
webrtcAdditionalHosts:
  - localhost
  - 127.0.0.1
  - dekdee2.informatics.buu.ac.th

paths:
  city-traffic:
    readUser: viewer
    readPass: viewpass
    publishUser: pub
    publishPass: pubpass