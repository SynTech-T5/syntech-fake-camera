  whep-gateway:
    image: bluenviron/mediamtx:latest
    container_name: whep-gateway
    command: ["/whep-gateway.yml"]
    volumes:
      - ./whep-gateway.yml:/whep-gateway.yml:ro
    restart: unless-stopped
    ports:
      - "8035:8035/tcp"    # WHEP/WHIP
      - "8189:8189/udp"    # WebRTC ICE/UDP
      - "8888:8888/tcp"    # HLS (สำหรับทดสอบ)
    depends_on:
      - rtsp-server