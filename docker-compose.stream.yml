version: '3.9'

services:
  # 🛰️ RTSP Hub (MediaMTX)
  rtsp-server:
    image: bluenviron/mediamtx:1.15.2
    container_name: rtsp-server
    command: ["/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    ports:
      - "8003:8003/tcp"   # RTSP
      - "8889:8889/tcp"   # WebRTC
      - "8189:8189/udp"
    networks:
      - stream-net

  # 🎬 จำลองกล้องส่งวิดีโอเข้า MediaMTX
  ffmpeg-publisher:
    image: lscr.io/linuxserver/ffmpeg:latest
    container_name: ffmpeg-publisher
    depends_on:
      - rtsp-server
    command: >
      -re -stream_loop -1
      -i https://eu-central-1.linodeobjects.com/savant-data/demo/Free_City_Street_Footage.mp4
      -rtsp_transport tcp
      -c:v libx264 -preset veryfast -tune zerolatency -g 30
      -an -f rtsp
      rtsp://pub:pubpass@rtsp-server:8003/city-traffic
    restart: unless-stopped
    networks:
      - stream-net

  # 🧠 YOLO Model Processor (GPU + OpenCV)
  yolo-city:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: yolo-city
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./model.py:/app/model.py
      - ./models:/app/models
      - ./mediamtx.yml:/app/mediamtx.yml:ro
    depends_on:
      - rtsp-server
      - ffmpeg-publisher
    command: ["bash", "-c", "sleep 5 && python3 model.py"]
    networks:
      - stream-net
      
  yolo-phone:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: yolo-phone
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./model.py:/app/model.py
      - ./models:/app/models
      - ./mediamtx.yml:/app/mediamtx.yml:ro
    depends_on:
      - rtsp-server
    command: ["bash", "-c", "sleep 5 && python3 model.py phone-cam"]
    networks:
      - stream-net

networks:
  stream-net:
    driver: bridge
