# RTSP สำหรับ publisher ภายใน container
rtspAddress: :8003

# WebRTC / WHEP
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# webrtcLocalTCPAddress: :8189  # uncomment ถ้าอยากใช้ TCP fallback
webrtcAdditionalHosts: [localhost, 127.0.0.1]  # ถ้าเข้าผ่าน LAN/โดเมนจริง ให้เพิ่ม IP/hostname ที่นี่

paths:
  city-traffic:
    # สิทธิ์สำหรับ viewer
    readUser: viewer
    readPass: viewpass
    # สิทธิ์สำหรับ publisher
    publishUser: pub
    publishPass: pubpass