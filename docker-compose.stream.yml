version: '3.8'

services:
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    ports:
      # WHEP / signaling (TCP) – ใช้พอร์ตเดียวกับ domain
      - "8035:8035/tcp"
      # ICE/Media (UDP) – ต้องเปิดบนไฟร์วอลล์ด้วย
      - "8036:8036/udp"

  ffmpeg-publisher:
    image: linuxserver/ffmpeg:version-4.4-cli
    container_name: ffmpeg-publisher
    depends_on: [rtsp-server]
    command: >
      -re -stream_loop -1
      -i https://eu-central-1.linodeobjects.com/savant-data/demo/Free_City_Street_Footage.mp4
      -rtsp_transport tcp
      -c:v libx264 -preset veryfast -tune zerolatency -g 30
      -an -f rtsp
      rtsp://pub:pubpass@rtsp-server:8003/city-traffic