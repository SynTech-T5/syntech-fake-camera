# ============================================
# ✅ MediaMTX Configuration (v1.15+ Compatible)
# ============================================

logLevel: info

# 🛰️ RTSP / WebRTC Ports
webrtc: yes
rtspAddress: :8003
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: ["localhost", "127.0.0.1", "192.168.1.39"]

# 🔐 Authentication
authInternalUsers:
  - user: pub
    pass: pubpass
    permissions:
      # ✅ สิทธิ์ publish สำหรับกล้องหลัก
      - action: publish
        path: city-traffic
      - action: publish
        path: city-traffic-processed

      # ✅ สิทธิ์ publish สำหรับกล้องมือถือ
      - action: publish
        path: phone-cam
      - action: publish
        path: phone-cam-processed

      # ✅ สิทธิ์ publish สำหรับกล้องบริษัท
      - action: publish
        path: company-cam
      - action: publish
        path: company-cam-processed

  - user: viewer
    pass: viewpass
    permissions:
      # ✅ สิทธิ์อ่านสำหรับทุก stream
      - action: read
        path: city-traffic
      - action: read
        path: city-traffic-processed

      - action: read
        path: phone-cam
      - action: read
        path: phone-cam-processed

      - action: read
        path: company-cam
      - action: read
        path: company-cam-processed

authMethods: [basic]

# 🎥 Streams
paths:
  # 🎬 กล้องจำลอง (ffmpeg publisher)
  city-traffic:
    source: publisher

  city-traffic-processed:
    source: publisher

  # 📱 กล้องโทรศัพท์
  phone-cam:
    source: rtsp://192.168.1.3:8080/h264_ulaw.sdp
    sourceOnDemand: yes

  phone-cam-processed:
    source: publisher

  # 🏢 กล้องภายนอก (เช่นสำนักงาน)
  company-cam:
    source: rtsp://43.209.5.94:8554/stream1
    sourceOnDemand: yes

  company-cam-processed:
    source: publisher
